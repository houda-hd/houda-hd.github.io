<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shenzhen North Railway Station - Holographic Blueprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050914; /* Deep space/hologram background */
            font-family: 'Inter', sans-serif;
            color: #a0c0ff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .ui-panel {
            pointer-events: auto;
            background: rgba(5, 12, 26, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 50, 150, 0.4);
        }
        /* Custom Checkbox Styling */
        .layer-toggle {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .layer-toggle:hover {
            color: #ffffff;
        }
        .layer-toggle input {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid #4a75c2;
            border-radius: 4px;
            margin-right: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
            cursor: pointer;
            outline: none;
        }
        .layer-toggle input:checked {
            background: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }
        .layer-toggle input:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 0.8rem;
        }
        /* Line Colors in UI */
        .color-l4 { color: #ff3366; text-shadow: 0 0 5px #ff3366; }
        .color-l5 { color: #b84dff; text-shadow: 0 0 5px #b84dff; }
        .color-l6 { color: #00e6e6; text-shadow: 0 0 5px #00e6e6; }
        .color-hsr { color: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="ui-panel p-6 max-w-sm h-fit">
            <h1 class="text-2xl font-bold text-white mb-1 uppercase tracking-wider text-blue-300 drop-shadow-md">Shenzhen North</h1>
            <h2 class="text-xs font-mono text-blue-400 mb-6 tracking-widest border-b border-blue-800 pb-2">Holographic Blueprint</h2>
            
            <p class="text-xs text-blue-200/70 mb-6 leading-relaxed">
                Explore the complex multi-level architecture of Shenzhen North Railway Station. Use controls below to dissect the layers.
            </p>

            <div id="layer-controls" class="font-mono text-sm">
                <label class="layer-toggle">
                    <input type="checkbox" id="toggle-roof" checked> 1. Main Roof (大屋顶)
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="toggle-hall" checked> 2. Waiting Hall (高架候车厅)
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="toggle-hsr" checked> <span class="color-hsr">3. HSR Tracks (国铁站台)</span>
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="toggle-l46" checked> 4. Metro <span class="color-l4">L4</span> & <span class="color-l6">L6</span> (Elevated)
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="toggle-l5" checked> 5. Metro <span class="color-l5">L5</span> (Underground)
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="toggle-east" checked> 6. East Square (东广场)
                </label>
            </div>

            <div class="mt-8 pt-4 border-t border-blue-900/50 flex space-x-4 text-xs font-mono">
                <button id="btn-rotate" class="px-3 py-1 bg-blue-900/40 hover:bg-blue-800/60 rounded border border-blue-700/50 transition-colors">Auto-Rotate [ON]</button>
                <button id="btn-reset" class="px-3 py-1 bg-blue-900/40 hover:bg-blue-800/60 rounded border border-blue-700/50 transition-colors">Reset View</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Core Variables ---
        let scene, camera, renderer, controls;
        let isAutoRotating = true;
        
        // Layer Groups
        const groups = {
            roof: new THREE.Group(),
            hall: new THREE.Group(),
            hsr: new THREE.Group(),
            l46: new THREE.Group(),
            l5: new THREE.Group(),
            east: new THREE.Group()
        };

        // Base Scale/Dimensions
        const STATION_W = 400; // X axis (East-West width)
        const STATION_L = 600; // Z axis (North-South length)

        // Palette (Holographic)
        const C_BASE = 0x2266cc;
        const C_ROOF = 0x4488ff;
        const C_HSR = 0xffffff;
        const C_L4 = 0xff3366;  // Red
        const C_L5 = 0xb84dff;  // Purple
        const C_L6 = 0x00e6e6;  // Cyan
        const C_SQUARE = 0x33aa88;

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050914, 0.0008);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.set(400, 300, 600);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optimize for high DPI
            renderer.toneMapping = THREE.AdditiveToneMapping;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI - 0.1; // Allow viewing from underneath!
            controls.target.set(0, 20, 0);

            setupEnvironment();
            buildStationLayers();
            setupUI();

            window.addEventListener('resize', onWindowResize, false);
            
            // Interaction disables auto-rotate
            controls.addEventListener('start', () => { 
                isAutoRotating = false; 
                document.getElementById('btn-rotate').innerText = "Auto-Rotate [OFF]";
            });

            animate();
        }

        function setupEnvironment() {
            // Ambient light is dim
            scene.add(new THREE.AmbientLight(0xffffff, 0.3));

            // Grid helper to establish the "blueprint" ground plane (Y=0)
            const grid = new THREE.GridHelper(2000, 100, 0x113366, 0x0a1530);
            grid.position.y = -5; // slightly below HSR level
            scene.add(grid);

            // X, Y, Z axes for reference
            const axes = new THREE.AxesHelper(100);
            axes.position.y = -4.9;
            scene.add(axes);
        }

        // --- Helper Function: Holographic Material ---
        function createHoloMesh(geometry, color, opacity = 0.2, emissiveIntensity = 0.5) {
            const group = new THREE.Group();

            // Transparent solid faces
            const matFace = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const mesh = new THREE.Mesh(geometry, matFace);
            group.add(mesh);

            // Glowing wireframe edges
            const edgesGeo = new THREE.EdgesGeometry(geometry);
            const matEdge = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            const wireframe = new THREE.LineSegments(edgesGeo, matEdge);
            group.add(wireframe);

            return group;
        }

        // --- Helper Function: Text Sprites ---
        function createLabel(text, x, y, z, color = '#ffffff') {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            context.font = "bold 36px monospace";
            context.textAlign = "center";
            context.textBaseline = "middle";
            
            // Subtle glow
            context.shadowColor = color;
            context.shadowBlur = 10;
            context.fillStyle = color;
            context.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true, 
                blending: THREE.AdditiveBlending,
                depthTest: false 
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(x, y, z);
            sprite.scale.set(100, 25, 1);
            sprite.renderOrder = 999;
            return sprite;
        }

        // --- Building the 6 Layers ---
        function buildStationLayers() {
            // Add all groups to scene
            Object.values(groups).forEach(g => scene.add(g));

            // ==========================================
            // 1. MAIN ROOF (大屋顶)
            // ==========================================
            const roofGeo = new THREE.PlaneGeometry(STATION_W + 150, STATION_L + 150, 40, 40);
            const pos = roofGeo.attributes.position;
            const roofBaseY = 80;
            
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                // Create sweeping architectural curve
                let z = roofBaseY;
                z -= Math.pow(x / (STATION_W * 0.5), 2) * 20; // curve down sides
                z -= Math.pow(y / (STATION_L * 0.5), 2) * 15; // curve down front/back
                z += Math.sin(x * 0.05) * 5; // wave effect
                pos.setZ(i, z);
            }
            roofGeo.computeVertexNormals();
            
            const roofMesh = createHoloMesh(roofGeo, C_ROOF, 0.15);
            roofMesh.rotation.x = -Math.PI / 2;
            groups.roof.add(roofMesh);
            groups.roof.add(createLabel("MAIN ROOF (大屋顶)", 0, roofBaseY + 25, 0, '#4488ff'));

            // ==========================================
            // 2. WAITING HALL (高架候车厅)
            // ==========================================
            const hallWidth = STATION_W - 50;
            const hallLength = STATION_L - 100;
            const hallHeight = 25;
            const hallY = 45; // Suspended above tracks
            
            const hallGeo = new THREE.BoxGeometry(hallWidth, hallHeight, hallLength);
            const hallMesh = createHoloMesh(hallGeo, C_BASE, 0.1);
            hallMesh.position.y = hallY;
            groups.hall.add(hallMesh);

            // Internal waiting hall divisions (visual detail)
            const floorGeo = new THREE.PlaneGeometry(hallWidth, hallLength, 10, 15);
            const floorMesh = new THREE.Mesh(floorGeo, new THREE.MeshBasicMaterial({color: 0x112244, transparent: true, opacity: 0.5, side: THREE.DoubleSide}));
            floorMesh.rotation.x = -Math.PI/2;
            floorMesh.position.y = hallY - hallHeight/2 + 0.1;
            groups.hall.add(floorMesh);

            groups.hall.add(createLabel("WAITING HALL", 0, hallY + hallHeight/2 + 10, hallLength/2 + 20, '#a0c0ff'));

            // ==========================================
            // 3. HIGH-SPEED RAIL TRACKS (国铁站台)
            // ==========================================
            const numPlatforms = 11;
            const platformWidth = 12;
            const trackWidth = 8;
            const platformSpacing = platformWidth + trackWidth;
            const totalHsrWidth = numPlatforms * platformSpacing;
            const startX = -totalHsrWidth / 2 + platformSpacing / 2;

            for(let i = 0; i < numPlatforms; i++) {
                const px = startX + (i * platformSpacing);
                
                // Platform
                const platGeo = new THREE.BoxGeometry(platformWidth, 4, STATION_L + 50);
                const platMesh = createHoloMesh(platGeo, C_HSR, 0.2);
                platMesh.position.set(px, 2, 0); // Ground level
                groups.hsr.add(platMesh);

                // Tracks (Lines)
                const trackGeo = new THREE.BoxGeometry(1, 0.5, STATION_L + 150);
                const trackMat = new THREE.MeshBasicMaterial({color: 0x555555});
                const t1 = new THREE.Mesh(trackGeo, trackMat);
                t1.position.set(px - platformWidth/2 - 2, 0.25, 0);
                const t2 = new THREE.Mesh(trackGeo, trackMat);
                t2.position.set(px + platformWidth/2 + 2, 0.25, 0);
                groups.hsr.add(t1, t2);
            }
            groups.hsr.add(createLabel("HSR PLATFORMS (国铁)", startX - 60, 5, 0, '#ffffff'));

            // ==========================================
            // 4. METRO LINE 4 & 6 - ELEVATED
            // ==========================================
            // Elevated on the East side (Positive X)
            const elevatedX = totalHsrWidth / 2 + 60;
            const elevatedY = 25; // Same level as lower waiting hall
            
            // Support Pillars
            const pillarGeo = new THREE.CylinderGeometry(2, 2, elevatedY, 8);
            for(let z = -STATION_L/2; z <= STATION_L/2; z+= 60) {
                const p = createHoloMesh(pillarGeo, C_BASE, 0.1);
                p.position.set(elevatedX, elevatedY/2, z);
                groups.l46.add(p);
            }

            // Line 4 (Red)
            const l4Geo = new THREE.BoxGeometry(8, 8, STATION_L + 200);
            const l4Mesh = createHoloMesh(l4Geo, C_L4, 0.3);
            l4Mesh.position.set(elevatedX - 6, elevatedY, 0);
            groups.l46.add(l4Mesh);
            groups.l46.add(createLabel("LINE 4", elevatedX - 25, elevatedY + 15, -150, '#ff3366'));

            // Line 6 (Cyan)
            const l6Geo = new THREE.BoxGeometry(8, 8, STATION_L + 200);
            const l6Mesh = createHoloMesh(l6Geo, C_L6, 0.3);
            l6Mesh.position.set(elevatedX + 6, elevatedY, 0);
            groups.l46.add(l6Mesh);
            groups.l46.add(createLabel("LINE 6", elevatedX + 25, elevatedY + 15, 150, '#00e6e6'));

            // Station enclosure for elevated lines
            const metroStationGeo = new THREE.BoxGeometry(40, 20, 200);
            const metroStationMesh = createHoloMesh(metroStationGeo, C_BASE, 0.1);
            metroStationMesh.position.set(elevatedX, elevatedY + 6, 0);
            groups.l46.add(metroStationMesh);

            // ==========================================
            // 5. METRO LINE 5 - UNDERGROUND
            // ==========================================
            // Runs East-West (X axis) under the East Square
            const l5Y = -35; 
            const l5Geo = new THREE.BoxGeometry(STATION_W + 300, 10, 10);
            const l5Mesh = createHoloMesh(l5Geo, C_L5, 0.3);
            l5Mesh.position.set(100, l5Y, 0); // Offset to East
            groups.l5.add(l5Mesh);

            // Underground Station Box
            const l5StationGeo = new THREE.BoxGeometry(150, 15, 40);
            const l5StationMesh = createHoloMesh(l5StationGeo, C_L5, 0.15);
            l5StationMesh.position.set(elevatedX + 40, l5Y, 0);
            groups.l5.add(l5StationMesh);

            groups.l5.add(createLabel("LINE 5 (UNDERGROUND)", elevatedX + 150, l5Y + 15, 0, '#b84dff'));

            // ==========================================
            // 6. EAST SQUARE & ARRIVALS (东广场)
            // ==========================================
            const squareX = elevatedX + 70;
            
            // Layered plazas connecting ground to underground
            const b1Geo = new THREE.BoxGeometry(120, 15, 180);
            const b1Mesh = createHoloMesh(b1Geo, C_SQUARE, 0.1);
            b1Mesh.position.set(squareX, -10, 0); // B1 level
            groups.east.add(b1Mesh);

            const b2Geo = new THREE.BoxGeometry(100, 15, 140);
            const b2Mesh = createHoloMesh(b2Geo, C_SQUARE, 0.1);
            b2Mesh.position.set(squareX, -25, 0); // B2 level connecting to L5
            groups.east.add(b2Mesh);

            // Circular Plaza feature on ground level
            const plazaGeo = new THREE.CylinderGeometry(50, 50, 2, 32);
            const plazaMesh = createHoloMesh(plazaGeo, C_SQUARE, 0.2);
            plazaMesh.position.set(squareX, 1, 0);
            groups.east.add(plazaMesh);
            
            // Vertical connection core (Elevators/Stairs)
            const coreGeo = new THREE.BoxGeometry(20, 60, 20);
            const coreMesh = createHoloMesh(coreGeo, C_SQUARE, 0.3);
            coreMesh.position.set(squareX, -5, 0);
            groups.east.add(coreMesh);

            groups.east.add(createLabel("EAST SQUARE (东广场)", squareX, 15, 0, '#33aa88'));
        }

        function setupUI() {
            // Map checkbox IDs to group objects
            const toggles = {
                'toggle-roof': groups.roof,
                'toggle-hall': groups.hall,
                'toggle-hsr': groups.hsr,
                'toggle-l46': groups.l46,
                'toggle-l5': groups.l5,
                'toggle-east': groups.east
            };

            for (const [id, group] of Object.entries(toggles)) {
                document.getElementById(id).addEventListener('change', (e) => {
                    group.visible = e.target.checked;
                });
            }

            document.getElementById('btn-rotate').addEventListener('click', (e) => {
                isAutoRotating = !isAutoRotating;
                e.target.innerText = isAutoRotating ? "Auto-Rotate [ON]" : "Auto-Rotate [OFF]";
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                camera.position.set(400, 300, 600);
                controls.target.set(0, 20, 0);
                controls.update();
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (isAutoRotating) {
                const time = Date.now() * 0.0002;
                const radius = 700;
                // Rotate around the station center
                camera.position.x = Math.cos(time) * radius;
                camera.position.z = Math.sin(time) * radius;
                camera.lookAt(controls.target);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        // Boot
        init();
    </script>
</body>
</html>
