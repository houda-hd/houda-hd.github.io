<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>毛毛力大王 - 液态玻璃动态卡片</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: #f4f4f6;
      overflow: hidden;
      position: relative;
    }

    /* 模拟视频中的底层大字排版背景，方便体现液态玻璃折射与磨砂感 */
    .bg-typography {
      position: absolute;
      inset: -10%;
      font-size: 46px;
      font-weight: 600;
      line-height: 1.55;
      color: rgba(28, 28, 30, 0.78);
      letter-spacing: 2px;
      user-select: none;
      pointer-events: none;
      word-break: break-all;
      z-index: 0;
    }

    /* 整体组件容器 */
    .widget-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部圆形飞鼠头像框 */
    .avatar-circle {
      width: 172px;
      height: 172px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #ffffff 65%, #f2f4f8 100%);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.14),
        inset 0 2px 4px rgba(255, 255, 255, 0.95),
        inset 0 -3px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* 飞鼠 SVG 容器 */
    .momonga-svg {
      width: 158px;
      height: 158px;
      transform-origin: center bottom;
    }

    /* 身体呼吸微动 */
    .body-breathe {
      animation: breathe 2.4s ease-in-out infinite;
      transform-origin: 100px 150px;
    }

    /* 耳机轻微随节奏起伏 */
    .headphone-bob {
      animation: headBob 2.4s ease-in-out infinite;
      transform-origin: 100px 95px;
    }

    /* 笔记本电脑屏幕微幅反光/起伏 */
    .laptop-group {
      animation: laptopTap 1.2s ease-in-out infinite;
      transform-origin: 135px 140px;
    }

    /* 爪子敲击键盘交替动作 */
    .paw-left {
      animation: pawTypeLeft 0.45s ease-in-out infinite alternate;
      transform-origin: 112px 136px;
    }

    .paw-right {
      animation: pawTypeRight 0.45s ease-in-out infinite alternate;
      transform-origin: 122px 132px;
    }

    /* 偶尔眨眼动画 */
    .eyes-group {
      animation: blinkEyes 4.5s infinite;
      transform-origin: 105px 104px;
    }

    /* 液态玻璃（Liquid Glass）卡片 */
    .liquid-glass-card {
      margin-top: -12px; /* 与圆形头像底部轻微叠压 */
      width: 236px;
      padding: 22px 24px 20px;
      border-radius: 34px;
      text-align: center;
      position: relative;
      z-index: 3;

      /* 核心液态玻璃材质：半透明高光渐变 + 强背景模糊 + 边缘高光内阴影 */
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.72) 0%,
        rgba(255, 255, 255, 0.46) 50%,
        rgba(245, 247, 252, 0.65) 100%
      );
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);

      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.12),
        0 4px 12px rgba(0, 0, 0, 0.05),
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -3px 6px rgba(255, 255, 255, 0.45);
    }

    /* 液态玻璃顶部高光反射带 */
    .liquid-glass-card::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 18px;
      right: 18px;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.85) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
    }

    .card-title {
      font-size: 32px;
      font-weight: 700;
      color: #111111;
      letter-spacing: 0.5px;
      line-height: 1.25;
    }

    .card-subtitle {
      margin-top: 4px;
      font-size: 22px;
      font-weight: 500;
      color: #8a8a8e;
      letter-spacing: 1px;
      animation: pulseText 2s ease-in-out infinite;
    }

    /* 关键帧定义 */
    @keyframes breathe {
      0%, 100% {
        transform: translateY(0) scaleY(1);
      }
      50% {
        transform: translateY(-2.2px) scaleY(1.018);
      }
    }

    @keyframes headBob {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-2.8px) rotate(-0.8deg);
      }
    }

    @keyframes laptopTap {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(0.8px);
      }
    }

    @keyframes pawTypeLeft {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(-3.5px) rotate(-8deg);
      }
    }

    @keyframes pawTypeRight {
      0% {
        transform: translateY(-3px) rotate(6deg);
      }
      100% {
        transform: translateY(0.5px) rotate(0deg);
      }
    }

    @keyframes blinkEyes {
      0%, 46%, 50%, 96%, 100% {
        transform: scaleY(1);
      }
      48%, 98% {
        transform: scaleY(0.15);
      }
    }

    @keyframes pulseText {
      0%, 100% {
        opacity: 0.85;
      }
      50% {
        opacity: 0.45;
      }
    }
  </style>
</head>
<body>

  <!-- 背景排版层（用于衬托液态玻璃效果） -->
  <div class="bg-typography">
    App 里面功能会多<br>
    的界面交互设计那<br>
    让我办公效率全都<br>
    混在一起直接起飞<br>
    文件整理自动化处<br>
    档、语音转文字输
  </div>

  <!-- 核心组件 -->
  <div class="widget-wrapper">
    <!-- 圆形动态飞鼠头像 -->
    <div class="avatar-circle">
      <svg class="momonga-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 蓬松大尾巴（背景淡蓝色） -->
        <g class="body-breathe">
          <path d="M52 136C34 126 30 98 46 82C58 70 76 74 82 86" fill="#D4E8F8" />
          <path d="M49 124C43 121 39 115 39 109M44 104C43 97 46 90 51 85M58 80C64 77 71 78 76 81"
                stroke="#181818" stroke-width="3.6" stroke-linecap="round" />

          <!-- 右耳（远端） -->
          <path d="M112 72C112 46 144 44 146 70C147 82 138 89 128 89" fill="#FFFFFF" stroke="#181818" stroke-width="4.2" stroke-linecap="round" />
          <path d="M119 72C120 56 138 56 139 71C139 78 133 82 127 82" fill="#D4E8F8" />
          <path d="M124 76C126 72 130 71 133 74" stroke="#181818" stroke-width="3.2" stroke-linecap="round" />

          <!-- 身体与头部轮廓 -->
          <path d="M62 152C52 142 50 124 56 108C58 92 68 78 86 75C105 72 124 80 130 96C136 112 134 134 122 152"
                fill="#FFFFFF" />
          <path d="M64 150C54 141 51 124 57 109M84 75C98 73 114 77 123 87"
                stroke="#181818" stroke-width="4.2" stroke-linecap="round" />

          <!-- 左侧脸颊毛发细线 -->
          <path d="M53 114L44 113M52 123L43 124M55 132L47 135"
                stroke="#181818" stroke-width="3.4" stroke-linecap="round" />

          <!-- 眉毛 -->
          <path d="M92 92L97 95M116 94L111 96" stroke="#181818" stroke-width="3.4" stroke-linecap="round" />

          <!-- 眼睛（半眯得意神态） -->
          <g class="eyes-group">
            <!-- 左眼 -->
            <ellipse cx="90" cy="104" rx="7.5" ry="6" fill="#FFFFFF" stroke="#181818" stroke-width="3.6" />
            <path d="M83 103C86 105.5 94 105.5 97 103" stroke="#181818" stroke-width="3.4" stroke-linecap="round" />
            <!-- 右眼 -->
            <ellipse cx="118" cy="104" rx="7.5" ry="6" fill="#FFFFFF" stroke="#181818" stroke-width="3.6" />
            <path d="M111 103C114 105.5 122 105.5 125 103" stroke="#181818" stroke-width="3.4" stroke-linecap="round" />
          </g>

          <!-- 淡蓝色圆鼻子 -->
          <ellipse cx="104" cy="105" rx="5.5" ry="4.5" fill="#B9DCF6" />

          <!-- W形小嘴 -->
          <path d="M98 113C99.5 116 102.5 116 104 113.5C105.5 116 108.5 116 110 113"
                stroke="#181818" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

          <!-- 粉色腮红与斜线 -->
          <ellipse cx="81" cy="115" rx="8.5" ry="5.5" fill="#F9C6D0" />
          <path d="M77 117L79 113M81 117L83 113M85 117L87 113" stroke="#181818" stroke-width="2.2" stroke-linecap="round" />

          <ellipse cx="127" cy="115" rx="8.5" ry="5.5" fill="#F9C6D0" />
          <path d="M123 117L125 113M127 117L129 113M131 117L133 113" stroke="#181818" stroke-width="2.2" stroke-linecap="round" />

          <!-- 左耳（前景） -->
          <path d="M62 84C54 58 84 46 94 70C97 78 93 86 85 88" fill="#FFFFFF" stroke="#181818" stroke-width="4.2" stroke-linecap="round" />
          <path d="M69 80C64 64 82 57 88 72C90 77 87 82 82 83" fill="#D4E8F8" />
          <path d="M76 82C77 77 81 76 84 78" stroke="#181818" stroke-width="3.2" stroke-linecap="round" />
        </g>

        <!-- 淡蓝色头戴式耳机 -->
        <g class="headphone-bob">
          <!-- 头梁 -->
          <path d="M66 96C66 64 114 58 124 84" stroke="#181818" stroke-width="11" stroke-linecap="round" />
          <path d="M66 96C66 64 114 58 124 84" stroke="#85C2F2" stroke-width="5.5" stroke-linecap="round" />
          <!-- 左侧耳罩 -->
          <rect x="53" y="88" width="22" height="26" rx="11" transform="rotate(-10 53 88)"
                fill="#85C2F2" stroke="#181818" stroke-width="4" />
          <path d="M60 94C59 99 60 105 62 108" stroke="#CBE6FA" stroke-width="2.6" stroke-linecap="round" />
        </g>

        <!-- 敲键盘的小手（远端右手） -->
        <g class="paw-right">
          <path d="M116 130C121 124 128 126 127 133C126 137 120 138 116 136"
                fill="#FFFFFF" stroke="#181818" stroke-width="3.8" stroke-linecap="round" />
        </g>

        <!-- 淡蓝色笔记本电脑 -->
        <g class="laptop-group">
          <!-- 键盘底座 -->
          <path d="M90 140L132 144L142 149L98 146Z" fill="#73B3E6" stroke="#181818" stroke-width="3.6" stroke-linejoin="round" />
          <!-- 屏幕外壳（B面/A面） -->
          <path d="M132 144L145 106L182 111L168 149Z" fill="#8BC4F2" stroke="#181818" stroke-width="3.8" stroke-linejoin="round" />
          <!-- 屏幕高光 -->
          <path d="M148 112L174 115" stroke="#CBE6FA" stroke-width="2.5" stroke-linecap="round" />
        </g>

        <!-- 敲键盘的小手（近端左手，遮挡部分键盘边缘） -->
        <g class="paw-left">
          <path d="M96 133C104 132 114 132 118 136C121 139 118 144 112 143C106 142 98 141 94 140"
                fill="#FFFFFF" stroke="#181818" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </svg>
    </div>

    <!-- 液态玻璃质感状态卡片 -->
    <div class="liquid-glass-card">
      <div class="card-title">毛毛力大王</div>
      <div class="card-subtitle">安装中</div>
    </div>
  </div>

</body>
</html>
