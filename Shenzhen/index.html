<style>:root{--o:#D94E1F;--k:#000;font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}

#app{position:fixed;inset:0;width:100vw;height:100dvh}

.lbl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{font:600 11px/1.3 "Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;background:#fff;border:1.5px solid var(--k);padding:2px 6px;white-space:nowrap;transform:translateY(-6px)}

#panel{position:fixed;left:0;top:0;bottom:0;width:360px;background:#fff;border-right:2px solid var(--k);display:flex;flex-direction:column;z-index:5}
#grip{display:none}
#body{overflow-y:auto;padding:20px;flex:1}
header b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1}
header span{display:block;margin-top:6px;font-size:13px;color:#555}
h3{font-size:12px;font-weight:700;border-top:3px solid var(--k);padding-top:6px;margin:20px 0 8px;display:flex;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--k);padding:8px 11px;cursor:pointer;color:var(--k);border-radius:0;min-height:36px}
button:focus-visible{outline:3px solid var(--o);outline-offset:1px}
button.on{background:var(--k);color:#fff}
button.o{background:var(--o);border-color:var(--o);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.grid button{padding:8px 0}
.list>div{display:flex;gap:6px;margin-bottom:6px}
.list>div button:first-child{flex:1;text-align:left}
#stop{width:100%;margin-top:4px}
#info{font-size:13px;line-height:1.55;max-width:60ch}
input[type=range]{width:100%;accent-color:var(--o)}
#fab{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;width:48px;height:48px;font-size:20px;background:var(--o);border-color:var(--o);color:#fff}
@media(max-width:960px){
#panel{left:0;right:0;top:auto;bottom:0;width:auto;height:66dvh;border:0;border-top:3px solid var(--k);border-radius:14px 14px 0 0;transform:translateY(35dvh);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
#grip{display:block;padding:12px 0;touch-action:none;cursor:grab}
#grip i{display:block;width:44px;height:5px;margin:auto;background:#bbb;border-radius:3px}
#fab.show{display:block}
#body{padding:0 16px 24px}
}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
