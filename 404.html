<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面未找到 | HOUDA+</title>
  <meta name="robots" content="noindex"/>
  <meta content="HOUDA+ 404 页面 - 该地址不存在，将自动返回首页。" name="description"/>
  <meta content="#f4f4f6" name="theme-color"/>
  <link href="assets/HOUDA_squre.jpeg" rel="icon"/>
  <link crossorigin href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" rel="stylesheet"/>
  <style>
  /* ═══════════════════════════════════════════════════════════
     HOUDA+ 404 · 与 index.html 同一视觉语言
     银灰底 + 纯白浮空卡片 + 漫射阴影 + 单一蓝色强调
     ═══════════════════════════════════════════════════════════ */

  :root {
    --bg: #f4f4f6;
    --bg-card: #ffffff;
    --bg-elevated: #fafafa;
    --text-primary: #1a1a1f;
    --text-secondary: #5c5c66;
    --text-tertiary: #9a9aa3;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: rgba(37,99,235,0.06);
    --green: #16a34a;
    --green-light: rgba(22,163,74,0.08);
    --border-hairline: rgba(0,0,0,0.06);
    --border-soft: rgba(0,0,0,0.04);

    --shadow-ambient:
      0 1px 2px rgba(0,0,0,0.03),
      0 8px 24px rgba(0,0,0,0.04),
      0 24px 56px rgba(0,0,0,0.03);
    --shadow-float:
      0 2px 4px rgba(0,0,0,0.03),
      0 12px 32px rgba(0,0,0,0.06),
      0 32px 72px rgba(0,0,0,0.04);

    --ease-fluid: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.22, 0.61, 0.36, 1);

    --dur-press: 120ms;
    --dur-fast: 200ms;
    --dur-normal: 400ms;
    --dur-slow: 700ms;

    --font-display: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
    --font-body: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;

    --radius-card: 1.25rem;
    --radius-pill: 999px;
    --radius-input: 0.75rem;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font: 100%/1.6 var(--font-body);
    color: var(--text-primary);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow-x: clip;
    overscroll-behavior-x: none;
    width: 100%;
    position: relative;
  }

  body {
    background: var(--bg);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    overflow-x: clip;
    overscroll-behavior-x: none;
  }

  /* 漫射中性光晕，制造空间纵深 */
  .ambient-wash {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(56% 50% at 82% 10%, rgba(37,99,235,0.07), transparent 70%),
      radial-gradient(46% 44% at 6% 92%, rgba(22,163,74,0.045), transparent 70%);
  }

  .stage {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 1.5rem 2.5rem;
    text-align: center;
  }

  /* ─── 卡片 ─── */
  .panel {
    width: 100%;
    max-width: 34rem;
    background: var(--bg-card);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-ambient);
    padding: 2.5rem 1.75rem 2.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  @media (min-width: 480px) {
    .panel { padding: 3rem 2.5rem 2.5rem; }
  }

  .logo-shell {
    padding: 0.4375rem;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 1.375rem;
    box-shadow: var(--shadow-float);
    margin-bottom: 1.75rem;
  }
  .logo {
    display: block;
    width: 88px;
    height: 88px;
    border-radius: calc(1.375rem - 0.4375rem);
    object-fit: cover;
  }

  .code-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-light);
    padding: 0.375rem 0.875rem;
    border-radius: var(--radius-pill);
    margin-bottom: 1.125rem;
  }

  .code {
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 14vw, 5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.05em;
    color: var(--text-primary);
    margin-bottom: 0.875rem;
  }

  .lede {
    font-size: clamp(1rem, 3.4vw, 1.125rem);
    line-height: 1.6;
    color: var(--text-secondary);
    max-width: 22rem;
    margin-bottom: 1.5rem;
  }

  .countdown {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg-elevated);
    border: 1px solid var(--border-hairline);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-pill);
    margin-bottom: 1.75rem;
  }
  .countdown i { color: var(--text-tertiary); font-size: 1rem; }
  #count {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 0.75rem;
    display: inline-block;
  }

  /* ─── 按钮 ─── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9375rem;
    letter-spacing: -0.01em;
    padding: 0.8125rem 0.8125rem 0.8125rem 1.5rem;
    border-radius: var(--radius-pill);
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: var(--text-primary);
    color: #ffffff;
    box-shadow: var(--shadow-ambient);
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--dur-press) var(--ease-out),
                background var(--dur-fast) var(--ease-fluid),
                box-shadow var(--dur-fast) var(--ease-fluid);
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -130%;
    width: 55%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: skewX(-18deg);
    transition: left var(--dur-normal) var(--ease-fluid);
    pointer-events: none;
  }
  .btn-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: var(--radius-pill);
    background: rgba(255,255,255,0.15);
    font-size: 0.8125rem;
    transition: transform var(--dur-fast) var(--ease-fluid);
  }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover { background: var(--accent); box-shadow: var(--shadow-float); }
    .btn:hover::after { left: 130%; }
    .btn:hover .btn-icon { transform: translate(2px, -1px) scale(1.05); }
  }

  /* ─── 页脚 ─── */
  .page-footer {
    position: relative;
    z-index: 1;
    text-align: center;
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    padding: 0 1.5rem 2.5rem;
  }

  /* ─── 入场动效 ─── */
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeIn var(--dur-slow) var(--ease-out) forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .d1 { animation-delay: 0.08s; }
  .d2 { animation-delay: 0.16s; }
  .d3 { animation-delay: 0.24s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .fade-in { opacity: 1 !important; transform: none !important; animation: none !important; }
  }

  @media (max-width: 767px) {
    .stage { padding: 3rem 1rem 2rem; gap: 2rem; }
    a, button { touch-action: manipulation; }
  }
  </style>
</head>
<body>

  <div class="ambient-wash"></div>

  <main class="stage">
    <div class="panel fade-in">
      <!-- Logo -->
      <div class="logo-shell">
        <img src="assets/HOUDA_squre.jpeg"
             alt="HOUDA+ Logo"
             class="logo" />
      </div>

      <!-- 主体文本 -->
      <span class="code-badge fade-in d1"><i class="ph-bold ph-compass" aria-hidden="true"></i> Error 404</span>
      <h1 class="code fade-in d1">404</h1>
      <p class="lede fade-in d2">哎呀，这个页面似乎走丢了。</p>

      <!-- 倒计时文字 -->
      <p id="countdownText" class="countdown fade-in d2">
        <i class="ph-bold ph-clock-countdown" aria-hidden="true"></i>
        将在 <span id="count">5</span> 秒后返回首页…
      </p>

      <!-- 返回按钮 -->
      <a href="/index.html" class="btn fade-in d3">
        立即返回首页
        <span class="btn-icon" aria-hidden="true"><i class="ph-bold ph-arrow-right"></i></span>
      </a>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="page-footer fade-in d3">
    © 2025 HOUDA+ | 侯明昊碗慧通讯录互吃大学
  </footer>

  <!-- 倒计时逻辑 -->
  <script>
    let timeLeft = 5;
    const countDisplay = document.getElementById('count');
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        window.location.href = '/index.html';
      } else {
        countDisplay.textContent = timeLeft;
      }
    }, 1000);
  </script>

</body>
</html>
