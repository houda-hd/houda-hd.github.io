<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Literature · 英文每日一言</title>
<style>
  /* ===== 字体栈：用户指定 Times New Roman + 宋体 =====
     英文/拉丁字符优先 Times New Roman，中文回退宋体（SimSun / Songti），
     最终兜底衬线 serif。 */
  :root {
    --font-serif: "Times New Roman", "宋体", SimSun, "Songti SC", serif;

    --parchment: #f4ecd8;
    --parchment-deep: #ebe0c7;
    --ink: #2a2017;
    --ink-light: #5c4f3e;
    --ink-faint: #9a8b75;
    --gold: #a8894a;
    --burgundy: #7a2e2e;
    --olive: #6b6332;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 18px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
  }

  /* ===== 羊皮纸纹理层 ===== */
  .paper-texture {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(168,137,74,0.06) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 85%, rgba(122,46,46,0.04) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(90,75,50,0.07) 100%);
  }
  .paper-fibers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0.035;
    background-image:
      repeating-linear-gradient(91deg, var(--ink) 0px, var(--ink) 0.5px, transparent 0.5px, transparent 3px),
      repeating-linear-gradient(1deg, var(--ink) 0px, var(--ink) 0.5px, transparent 0.5px, transparent 4px);
  }

  /* ===== 页面容器 ===== */
  .page-shell {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    padding: 56px 28px calc(56px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  /* ===== 扉页标题 ===== */
  .frontispiece {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 48px;
    padding-top: 12px;
  }
  .ornament-top {
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 14px;
    margin-bottom: 22px;
    opacity: 0.85;
  }
  .title-main {
    font-size: 38px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .title-rule {
    width: 46px;
    height: 2px;
    background: var(--burgundy);
    margin: 18px 0;
    position: relative;
  }
  .title-rule::before, .title-rule::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 5px; height: 5px;
    background: var(--gold);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .title-rule::before { left: -14px; }
  .title-rule::after { right: -14px; }
  .title-sub {
    font-size: 15px;
    font-style: italic;
    color: var(--ink-light);
    letter-spacing: 3px;
  }

  /* ===== 手稿卡片 ===== */
  .manuscript {
    position: relative;
    padding: 44px 32px 34px;
    background: linear-gradient(165deg, #f7f0dc 0%, #f0e6cb 100%);
    border-radius: 6px 8px 7px 5px;
    border: 1px solid rgba(168,137,74,0.15);
    box-shadow:
      0 4px 20px rgba(90,70,40,0.12),
      0 30px 60px rgba(90,70,40,0.08),
      inset 0 1px 0 rgba(255,245,220,0.6);
    margin-bottom: 46px;
  }

  .ms-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 30px;
  }
  .weekday {
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-style: italic;
  }
  .date-line {
    font-size: 17px;
    color: var(--ink-light);
    letter-spacing: 1px;
  }

  .gold-rule {
    height: 1px;
    margin: 0 16px;
    background: linear-gradient(90deg, transparent 0%, rgba(168,137,74,0.4) 30%, rgba(168,137,74,0.6) 50%, rgba(168,137,74,0.4) 70%, transparent 100%);
    position: relative;
  }
  .gold-rule::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 7px; height: 7px;
    background: rgba(168,137,74,0.5);
    transform: translate(-50%,-50%) rotate(45deg);
  }
  .gold-rule.top { margin-bottom: 38px; }
  .gold-rule.bottom { margin-top: 36px; }

  /* 主体引文 */
  .verse { position: relative; padding: 0 8px; min-height: 200px; }

  .drop-quote {
    font-family: var(--font-serif);
    font-size: 72px;
    line-height: 1;
    color: rgba(168,137,74,0.35);
    display: block;
  }
  .drop-quote.open { margin-bottom: -14px; margin-left: -12px; }
  .drop-quote.close { text-align: right; margin-top: -8px; margin-right: -12px; }

  .verse-text {
    display: block;
    font-size: 21px;
    line-height: 1.8;
    color: var(--ink);
    letter-spacing: 0.4px;
    text-align: justify;
    text-justify: inter-character;
    cursor: pointer;
  }
  .verse-text.clamped {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 6;
    overflow: hidden;
  }
  .tap-hint {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
    letter-spacing: 2px;
    opacity: 0.7;
  }

  /* 署名出处 */
  .attribution { display: flex; justify-content: flex-end; margin-top: 34px; }
  .em-dash {
    width: 44px; height: 1.5px;
    background: var(--ink-light);
    margin-right: 16px; margin-top: 16px;
    flex-shrink: 0;
  }
  .source-block { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .author { font-size: 19px; font-weight: 600; color: var(--burgundy); letter-spacing: 0.5px; }
  .work { font-size: 15px; font-style: italic; color: var(--ink-light); }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .year, .era { font-size: 13px; color: var(--ink-faint); letter-spacing: 1px; }
  .dot { color: var(--ink-faint); font-size: 13px; }

  /* 操作区 */
  .actions { display: flex; align-items: center; justify-content: center; margin-top: 28px; }
  .action-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 0;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease;
    border-radius: 8px;
  }
  .action-btn:hover { background: rgba(168,137,74,0.06); }
  .action-btn:active { background: rgba(168,137,74,0.12); }
  .action-icon { font-size: 19px; color: var(--gold); }
  .action-label { font-size: 12px; color: var(--ink-faint); letter-spacing: 2px; text-transform: uppercase; }
  .action-divider { width: 1px; height: 50px; background: rgba(168,137,74,0.25); }

  /* ===== 底部语录区 ===== */
  .colophon {
    margin-top: auto;
    padding-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .time-signal { padding: 7px 18px; border: 1px solid rgba(168,137,74,0.3); border-radius: 4px; }
  .time-label { font-size: 13px; font-style: italic; color: var(--ink-faint); letter-spacing: 2px; }
  .collection-info { display: flex; align-items: baseline; gap: 8px; }
  .count-num { font-size: 20px; font-weight: 600; color: var(--gold); }
  .count-label { font-size: 13px; color: var(--ink-faint); letter-spacing: 1px; }
  .motto {
    font-size: 14px; font-style: italic; color: var(--ink-light);
    text-align: center; margin-top: 8px; padding: 0 24px; line-height: 1.6;
  }
  .motto-attr { font-size: 11px; color: var(--ink-faint); letter-spacing: 2px; }

  /* 入场动效 */
  .fade-up { animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 轻量 toast */
  .toast {
    position: fixed;
    left: 50%; bottom: 80px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--parchment);
    font-family: var(--font-serif);
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 4px;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

  <div class="toast" id="toast"></div>

/* ===== 日期工具 ===== */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function getQuoteIndexForDate(d, total) {
  if (!total || total <= 0) return 0;
  const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  return seed % total;
}
function formatLongDate(d) {
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function ordinalSuffix(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function getRelativeDay(d) {
  const h = d.getHours();
  if (h < 6) return 'The dawn is near';
  if (h < 12) return 'Morning has broken';
  if (h < 18) return 'The afternoon wanes';
  return 'Evening descends';
}

/* ===== 渲染 ===== */
function render() {
  const now = new Date();
  const q = QUOTES[getQuoteIndexForDate(now, QUOTES.length)];

  document.getElementById('weekday').textContent = DAYS[now.getDay()];
  document.getElementById('dateline').textContent = formatLongDate(now);
  document.getElementById('verseText').textContent = q.text;
  document.getElementById('author').textContent = q.author;
  document.getElementById('work').textContent = '『 ' + q.source + ' 』';
  document.getElementById('year').textContent = q.year;
  document.getElementById('era').textContent = q.era;
  document.getElementById('timeLabel').textContent = getRelativeDay(now);
  document.getElementById('countNum').textContent = QUOTES.length;

  // 重置展开状态
  const vt = document.getElementById('verseText');
  vt.classList.add('clamped');
  document.getElementById('dropClose').style.display = 'none';
  document.getElementById('tapHint').style.display = 'block';

  window.__currentQuote = q;
}

/* ===== 交互：展开/折叠 ===== */
document.getElementById('verseText').addEventListener('click', function () {
  const vt = this;
  const expanded = vt.classList.toggle('clamped') === false;
  document.getElementById('dropClose').style.display = expanded ? 'block' : 'none';
  document.getElementById('tapHint').style.display = expanded ? 'none' : 'block';
});

/* ===== Toast ===== */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===== 复制 ===== */
document.getElementById('copyBtn').addEventListener('click', function () {
  const q = window.__currentQuote;
  if (!q) return;
  const text = `"${q.text}"\n— ${q.author}, ${q.source} (${q.year})`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Inscribed to clipboard'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
});
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('Inscribed to clipboard'); }
  catch (e) { showToast('Copy failed'); }
  document.body.removeChild(ta);
}

/* ===== 分享 ===== */
document.getElementById('shareBtn').addEventListener('click', function () {
  const q = window.__currentQuote;
  if (!q) return;
  const shareText = `"${q.text}" — ${q.author}`;
  if (navigator.share) {
    navigator.share({ title: 'Daily Literature', text: shareText, url: location.href })
      .catch(() => {});
  } else {
    showToast('No share on this device — use Copy');
  }
});

/* 初始化 */
render();
</script>
</body>
</html>
